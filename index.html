<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestLocal — Discover the Best Places in Every City</title>
    <meta name="description" content="Find top-rated restaurants, cafes, bars, activities and more across the UK's best cities. Honest reviews, ratings and maps." />
    <link rel="canonical" href="https://bestlocal.co.uk" />
    <meta property="og:title" content="BestLocal — Discover the Best Places in Every City" />
    <meta property="og:description" content="Find top-rated restaurants, cafes, bars and activities across the UK." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BestLocal",
      "url": "https://bestlocal.co.uk",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bestlocal.co.uk/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
